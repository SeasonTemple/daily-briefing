# ----------------------------------------------------------------------
# 抓取 / 处理规则
# ----------------------------------------------------------------------
fetch:
  concurrency: 4            # 一次 4 个并发 web_fetch
  per_source_timeout_sec: 10
  retry_on_5xx: 1
  user_agent: "daily-briefing/0.7 (+https://github.com/SeasonTemple/daily-briefing)"

time_window:
  primary_hours: 24         # 主窗口:24h 严格
  fallback_hours: 72         # fallback:3 天
  hard_max_hours: 168        # 硬上限:7 天
  per_source_min_count: 1    # 单源最少 1 条,保证多样
  total_min_count: 12        # 一天至少 12 条

llm:
  model: "M3"
  temperature: 0.3
  summary_max_chars: 80
  include_source_in_summary: true  # "[来源: OpenAI]"
  skip_if:
    - already_seen_24h
    - low_signal_keywords
    - non_ai_tech
