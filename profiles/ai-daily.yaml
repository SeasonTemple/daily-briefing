# ========================================================================
# AI Daily profile · 一手信源优先
#
# 加新领域 = 复制本文件改名 + 改 sources,代码零改动。
# 详见 profiles/README.md
#
# 信源设计原则:
#   T1   一手官方:模型厂家 X 官号 + newsroom + GitHub orgs
#   T1.5 论文:arXiv cs.AI/CL/LG + HF Papers
#   T2   二手权威:The Verge / TechCrunch / Ars Technica / Wired / MIT TR
#   T3   社区信号:HN / Reddit ML / Lobsters
#   T4   Newsletter:TLDR AI / Import AI / Latent Space / Ben's Bites
#   T5   中文:36Kr / 量子位 / 机器之心 / 少数派 / V2EX
#
# best_effort: true = cron 拉不到时 skip(用于 X RSSHub / 反爬强站),不阻塞 RSS 输出
# ========================================================================

profile: ai-daily
title: "AI 圈每日精华"
subtitle: "一手机构 + 关键人物 + arXiv + GitHub 的 AI 信号流"
description: |
  每天抓取 AI 一手机构(Anthropic / OpenAI / DeepMind / Meta / Mistral / xAI /
  DeepSeek / 智谱 / 月之暗面 / 通义)X 官号 + newsroom + GitHub + 关键人物推文,
  加上 arXiv / HF Papers / 权威二手 / 中文编辑稿,经 M3 LLM 脱水中文化摘要,
  产出可订阅的 RSS。
author: "Daily Briefing"
language: zh-CN
timezone: "Asia/Shanghai"
hours_lookback: 72
daily_limit: 20
output:
  rss: rss/ai-daily.xml
  markdown: reports/ai-daily-{date}.md
keywords:
  - LLM
  - 大模型
  - Agent
  - 多模态
  - RAG
  - Claude
  - GPT
  - Gemini
  - DeepSeek
  - Qwen
  - Mistral
  - Llama
  - Hugging Face
  - arXiv
  - RLHF

