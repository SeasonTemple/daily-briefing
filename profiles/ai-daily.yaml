# ========================================================================
# AI Daily profile · 一手信源优先 (重写版 for cron.py 兼容性)
# ========================================================================

profile: ai-daily
version: "0.9"
title: "AI 圈每日精华"
subtitle: "一手机构 + 关键人物 + arXiv + GitHub 的 AI 信号流"
description: |
  每天抓取 AI 一手机构(Anthropic / OpenAI / DeepMind / Meta / Mistral / xAI /
  DeepSeek / 智谱 / 月之暗面 / 通义)X 官号 + newsroom + GitHub + 关键人物推文,
  加上 arXiv / HF Papers / 权威二手 / 中文编辑稿,经 M3 LLM 脱水中文化摘要,
  产出可订阅的 RSS。
author: "Daily Briefing"
language: zh-CN
timezone: "Asia/Shanghai"
hours_lookback: 72
daily_limit: 20
output:
  rss: rss/ai-daily.xml
  markdown: reports/ai-daily-{date}.md
keywords:
  - LLM
  - 大模型
  - Agent
  - 多模态
  - Claude
  - GPT
  - Gemini
  - DeepSeek

# ========================================================================
# 全部信源 (cron.py 期望一个 sources: 顶层 list, 每项必须有 url 或 rss_url)
# ========================================================================
sources:

  # ----- T1 一手: arXiv 论文 -----
  - { type: rss, name: "arXiv cs.AI",     url: "http://export.arxiv.org/rss/cs.AI",                 tier: T1.5 }
  - { type: rss, name: "arXiv cs.CL",     url: "http://export.arxiv.org/rss/cs.CL",                 tier: T1.5 }
  - { type: rss, name: "arXiv cs.LG",     url: "http://export.arxiv.org/rss/cs.LG",                 tier: T1.5 }
  - { type: rss, name: "arXiv cs.CV",     url: "http://export.arxiv.org/rss/cs.CV",                 tier: T1.5, best_effort: true }
  - { type: rss, name: "arXiv cs.RO",     url: "http://export.arxiv.org/rss/cs.RO",                 tier: T1.5, best_effort: true }
  - { type: rss, name: "HF Daily Papers", url: "https://jamesg.blog/hf-papers.xml",                 tier: T1.5, best_effort: true }

  # ----- T1 一手: 厂家 newsroom / blog -----
  - { type: rss, name: "Anthropic News",   url: "https://www.anthropic.com/news/rss.xml",          tier: T1, best_effort: true }
  - { type: rss, name: "OpenAI Blog",      url: "https://openai.com/blog/rss.xml",                 tier: T1, best_effort: true }
  - { type: rss, name: "DeepMind Blog",    url: "https://deepmind.google/discover/blog/rss.xml",   tier: T1, best_effort: true }
  - { type: rss, name: "AWS ML Blog",      url: "https://aws.amazon.com/blogs/machine-learning/feed/", tier: T1 }
  - { type: rss, name: "Apple ML Research",url: "https://machinelearning.apple.com/rss.xml",        tier: T1, best_effort: true }
  - { type: rss, name: "Mistral AI News",  url: "https://mistral.ai/news/rss.xml",                 tier: T1, best_effort: true }
  - { type: rss, name: "Hugging Face Blog",url: "https://huggingface.co/blog/feed.xml",             tier: T1, best_effort: true }

  # ----- T1.5 论文 / 一手 GitHub -----
