name: Daily Briefing

on:
  # 每天 UTC 23:00 = 北京时间 07:00 早
  schedule:
    - cron: "0 23 * * *"
  # 允许手动触发(测试用)
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile name to run"
        required: false
        default: "ai-daily"
        type: string
      limit:
        description: "Max entries per RSS"
        required: false
        default: "20"
        type: string

permissions:
  contents: write   # 允许 git commit & push

jobs:
  build-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PROFILE: ${{ github.event.inputs.profile || 'ai-daily' }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: |
          mkdir -p rss reports
          python scripts/digest.py \
            --profile "$PROFILE" \
            --limit "$LIMIT" \
            2>&1 | tee /tmp/digest.log

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss/ reports/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily briefing RSS ($(date -u +%Y-%m-%d))"
          git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: digest-logs
          path: /tmp/digest.log
