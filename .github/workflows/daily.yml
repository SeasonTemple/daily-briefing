name: daily-briefing
on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = Asia/Shanghai 7:00
    - cron: '0 15 * * *'   # UTC 15:00 = Asia/Shanghai 23:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  discussions: write

jobs:
  fetch-raw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet feedparser requests pyyaml lxml

      - name: Fetch raw + write data/raw-*.json
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch.py \
            --profile profiles/ai-daily.yaml \
            --no-llm \
            --out data/raw-ai-daily-$(date -u +%Y%m%dT%H%M%S).json \
            --log logs/fetch-$(date -u +%Y%m%dT%H%M%S).log

      - name: Commit raw + log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new raw data"
          else
            git commit -m "chore(daily): fetch raw $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Notify Discussion (waiting for M3)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 推 Discussion 通知 user:raw 已就绪
          python3 scripts/notify_discussions.py || echo "Discussion push failed"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
