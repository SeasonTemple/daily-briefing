name: daily-briefing
on:
  schedule:
    # UTC 23:00 = Asia/Shanghai 7:00  (主)
    - cron: '0 23 * * *'
    # UTC 15:00 = Asia/Shanghai 23:00  (兜底)
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'profiles/ai-daily.yaml'
      - 'scripts/fetch.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet feedparser requests pyyaml lxml

      - name: Fetch raw (no LLM)
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch.py \
            --profile profiles/ai-daily.yaml \
            --out data/raw-ai-daily-$(date -u +%Y%m%dT%H%M%S).json

      - name: Commit raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No raw data changes"
          else
            git commit -m "chore(daily): fetch raw $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Notify Mavis via Discussion
        if: always()
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 触发一条 discussion, 通知 Mavis 接管
          LATEST=$(ls -1t data/raw-ai-daily-*.json 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            python3 scripts/notify_mavis.py "$LATEST" || echo "Notify failed, Mavis will pick up next session"
          fi
