name: daily-briefing
on:
  schedule:
    - cron: '0 23 * * *'   # Asia/Shanghai 7:00
    - cron: '0 15 * * *'   # Asia/Shanghai 23:00 兜底
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  models: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.GITHUB_TOKEN }}, fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet feedparser requests pyyaml
      - name: Fetch + gpt-4o summary + write RSS/HTML
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          python3 scripts/build_pipeline.py \
            --profile profiles/ai-daily.yaml \
            --out rss/ai-daily.xml \
            --html digests/ai-daily.html \
            --model gpt-4o \
            --log logs/cron-$(date -u +%Y%m%dT%H%M%S).log 2>&1 || true
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss/ digests/ logs/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): auto-rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
      - name: Trigger Pages rebuild
        if: always()
        run: |
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" -H "Content-Length: 0" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: build-log, path: logs/, if-no-files-found: ignore }
